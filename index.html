<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lilium Orientalis</title>
<style>
:root{--bg:#000;--fg:#e6d8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#e6d8ff}}
:root[data-theme="dark"]{--bg:#000;--fg:#e6d8ff}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 0%,#1a0533 0%,var(--bg) 60%);color:var(--fg)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif;cursor:pointer}
h1{font-weight:400;font-size:clamp(18px,5vw,28px);text-align:center;margin:0 16px 4px}
canvas{width:min(96vw,520px);aspect-ratio:3/4;display:block}
p{font-size:12px;opacity:.55;margin:4px 0 0}
</style>
</head>
<body>
<h1>flowers for gorgeous nouf🌷</h1>
<canvas id="c"></canvas>
<p>Tap to replay</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,S=0;
function fit(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(H,W*1.5)*.4;}
fit();addEventListener('resize',fit);
const V={add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],mul:(a,k)=>[a[0]*k,a[1]*k,a[2]*k],
cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]}};
const cl=v=>Math.max(0,Math.min(1,v)),ease=v=>v*v*(3-2*v);
let yaw=0;
function P(p){
  const c=Math.cos(yaw),s=Math.sin(yaw);
  const x=p[0]*c+p[2]*s,z=-p[0]*s+p[2]*c,y=p[1]-.85;
  const pc=Math.cos(.18),ps=Math.sin(.18);
  const y2=y*pc-z*ps,z2=y*ps+z*pc,k=3.2/(3.2+z2);
  return [W/2+x*k*S,H/2-y2*k*S,z2];
}
const FL=[
 {C:[-.28,1.12,.05],a:[-.7,.7,.15],s:.42,d:0},
 {C:[.32,.98,-.1],a:[.7,.62,-.2],s:.46,d:.6},
 {C:[-.2,.6,.22],a:[-.62,.5,.55],s:.36,d:1.2},
 {C:[.02,1.52,0],a:[0,1,.1],s:.2,d:0,bud:1},
 {C:[.22,1.32,.02],a:[.3,1,0],s:.17,d:0,bud:1}];
FL.forEach(f=>{
  f.a=V.norm(f.a);const r=Math.abs(f.a[1])>.9?[1,0,0]:[0,1,0];
  f.e1=V.norm(V.cross(f.a,r));f.e2=V.cross(f.a,f.e1);
  f.sp=[];for(let k=0;k<6;k++){const q=[];for(let i=0;i<24;i++)q.push([.08+Math.random()*.4,Math.random()*1.6-.8]);f.sp.push(q);}
});
const ST=[0,1,2].map(i=>{
  const f=FL[i],B=[(i-1)*.04,0,i%2?.03:-.03],E=V.add(f.C,V.mul(f.a,-.03));
  const Cc=[f.C[0]*.25+(i-1)*.05,f.C[1]*.55,f.C[2]*.3];
  return {B,E,Cc};
});
function bez(s,t){const u=1-t;return [0,1,2].map(k=>u*u*s.B[k]+2*u*t*s.Cc[k]+t*t*s.E[k]);}
function tp(f,az,b,u,v,sc){
  const r=V.add(V.mul(f.e1,Math.cos(az)),V.mul(f.e2,Math.sin(az)));
  const s=V.cross(f.a,r),phi=.05+b*(.55+.75*u);
  const dir=V.add(V.mul(f.a,Math.cos(phi)),V.mul(r,Math.sin(phi)));
  const w=.3*sc*Math.sin(Math.PI*Math.pow(u,.75))*(.45+.55*b);
  let p=V.add(f.C,V.mul(dir,sc*u*(.9+.1*b)));
  p=V.add(p,V.mul(s,v*w));
  return V.add(p,V.mul(f.a,v*v*w*.35*b));
}
const stars=Array.from({length:60},(_,i)=>i);
const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
function quadList(t,fl,out){
  const NU=9,NV=6;
  // leaves
  ST.forEach((s,i)=>{for(let j=0;j<3;j++){
    const g=ease(cl((t-.6-i*.3-j*.35)/2.4));if(g<=0)continue;
    const base=bez(s,.12+.2*j+i*.03),ang=(i*2.1+j*2.4),L=.38*g;
    const d=V.norm([Math.cos(ang),.35,Math.sin(ang)]),sd=V.norm(V.cross(d,[0,1,0]));
    const g2=[];
    for(let a=0;a<=NU;a++){g2.push([]);for(let c=0;c<=NV;c++){
      const u=a/NU,v=c/NV*2-1,w=.07*g*Math.sin(Math.PI*Math.pow(u,.7));
      let p=V.add(base,V.mul(d,L*u));p=V.add(p,[0,-.1*u*u*g,0]);p=V.add(p,V.mul(sd,v*w));g2[a].push(P(p));}}
    for(let a=0;a<NU;a++)for(let c=0;c<NV;c++){const q=[g2[a][c],g2[a+1][c],g2[a+1][c+1],g2[a][c+1]];
      out.push({z:(q[0][2]+q[2][2])/2,q,leaf:1});}
  }});
  // petals
  FL.forEach((f,fi)=>{
    let b=ease(cl((t-3.2-f.d)/4));let sc=f.s;
    if(t<3)return;
    if(f.bud){b*=.14;sc*=ease(cl((t-3)/2));}
    if(b<=0&&!f.bud)b=.001;
    for(let k=0;k<6;k++){
      const az=k*Math.PI/3+.2,g2=[];
      for(let a=0;a<=NU;a++){g2.push([]);for(let c=0;c<=NV;c++)g2[a].push(P(tp(f,az,b,a/NU,c/NV*2-1,sc)));}
      for(let a=0;a<NU;a++)for(let c=0;c<NV;c++){const q=[g2[a][c],g2[a+1][c],g2[a+1][c+1],g2[a][c+1]];
        out.push({z:(q[0][2]+q[2][2])/2,q,u:(a+.5)/NU,bud:f.bud});}
    }
  });
}
const PAL=['#9b4dff','#c9a0ff','#ffffff','#6a1fc4','#e6d8ff'];
const hx=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
function pal(t,off){const n=PAL.length,u=t/3+off,i=Math.floor(u),e=ease(u-i);
  return mix(hx(PAL[((i%n)+n)%n]),hx(PAL[(((i+1)%n)+n)%n]),e);}
const fc=t=>{const a=t*.5;return [Math.cos(a)*.8,.9+.45*Math.sin(a*.7),Math.sin(a)*.8];};
function fishQuads(t,out){
  const al=ease(cl((t-2)/2));if(al<=0)return;
  const c0=fc(t),n1=fc(t+.03),v=V.norm([n1[0]-c0[0],n1[1]-c0[1],n1[2]-c0[2]]);
  const sd=V.norm(V.cross(v,[0,1,0])),up=V.cross(sd,v);
  const w=Math.sin(t*7),L=.3,col=pal(t,0),col2=pal(t,.7);
  const X=(x,y,z)=>P(V.add(c0,V.add(V.mul(v,x),V.add(V.mul(up,y),V.mul(sd,z)))));
  const surf=(fn,nu,nv,cc,fa)=>{const g=[];
    for(let a=0;a<=nu;a++){g.push([]);for(let c=0;c<=nv;c++)g[a].push(fn(a/nu,c/nv));}
    for(let a=0;a<nu;a++)for(let c=0;c<nv;c++){const q=[g[a][c],g[a+1][c],g[a+1][c+1],g[a][c+1]];
      out.push({z:(q[0][2]+q[2][2])/2,q,fish:1,col:cc,fa:fa*al});}};
  surf((u,r)=>{const h=.07*Math.sin(Math.PI*Math.pow(.08+.92*u,.8)),th=r*Math.PI*2;
    return X(L*(.5-u),h*Math.cos(th),h*.65*Math.sin(th)+.03*w*u*u);},8,8,col,.85);
  surf((u,r)=>{const q=r*2-1;return X(-L/2-.28*u*(1-.25*q*q),.16*q*u,.04*Math.sin(t*7-u*4)*u);},6,6,col2,.6);
  surf((u,r)=>X(L*(.3-.7*u)-.08*r,.06+.11*r*Math.sin(Math.PI*u),0),6,3,col2,.6);
  surf((u,r)=>X(L*(.15-.5*u)-.05*r,-.06-.09*r*Math.sin(Math.PI*u),0),5,3,col2,.6);
}
function frame(t){
  ctx.clearRect(0,0,W,H);
  yaw=.3+t*.22;
  const fl=ease(cl((t-7.2)/3.5));
  // stems
  ST.forEach((s,i)=>{
    const n=Math.floor(46*ease(cl(t/3)));if(n<2)return;
    ctx.beginPath();
    for(let k=0;k<=n;k++){const p=P(bez(s,k/46));k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}
    ctx.strokeStyle='rgba(120,60,200,.5)';ctx.lineWidth=5;ctx.lineCap='round';ctx.stroke();
    ctx.strokeStyle='rgba(235,225,255,.95)';ctx.lineWidth=1;ctx.stroke();
  });
  const Q=[];quadList(t,fl,Q);fishQuads(t,Q);Q.sort((a,b)=>b.z-a.z);
  for(const o of Q){
    const q=o.q;ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);
    for(let i=1;i<4;i++)ctx.lineTo(q[i][0],q[i][1]);ctx.closePath();
    if(o.fish){
      ctx.fillStyle='rgba('+o.col+','+o.fa+')';ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=.5;ctx.stroke();
    }else if(o.leaf){
      ctx.fillStyle='rgba(90,40,170,'+(.25+.3*fl)+')';ctx.fill();
      ctx.strokeStyle='rgba(200,170,255,.6)';ctx.lineWidth=.6;ctx.stroke();
    }else{
      const col=o.bud?mix([235,225,255],[150,90,230],1-o.u):mix([130,50,230],[255,255,255],ease(cl((o.u-.08)/.5)));
      ctx.fillStyle='rgba('+col+','+(fl*.96)+')';ctx.fill();
      ctx.strokeStyle='rgba(225,200,255,'+(.9-.6*fl)+')';ctx.lineWidth=.6;ctx.stroke();
    }
  }
  // stamens & speckles
  if(t>4.5)FL.forEach(f=>{
    if(f.bud)return;
    const b=ease(cl((t-3.2-f.d)/4)),sc=f.s;if(b<.3)return;
    for(let k=0;k<7;k++){
      const az=k*.9+.3,r=V.add(V.mul(f.e1,Math.cos(az)),V.mul(f.e2,Math.sin(az)));
      const tip=V.add(V.add(f.C,V.mul(f.a,sc*.55*b)),V.mul(r,sc*(.12+.1*(k%3))*b));
      const a0=P(f.C),a1=P(tip);
      ctx.strokeStyle=k==6?'rgba(255,255,255,.95)':'rgba(220,200,255,.85)';ctx.lineWidth=.9;
      ctx.beginPath();ctx.moveTo(a0[0],a0[1]);ctx.lineTo(a1[0],a1[1]);ctx.stroke();
      ctx.fillStyle=k==6?'#fff':'#b57cff';ctx.beginPath();ctx.arc(a1[0],a1[1],k==6?2.6:2,0,7);ctx.fill();
    }
    if(fl>.3){ctx.fillStyle='rgba(60,10,120,'+fl*.85+')';
      for(let k=0;k<6;k++)f.sp[k].forEach(([u,v])=>{
        const p=P(tp(f,k*Math.PI/3+.2,b,u,v,sc)),w=1.1;ctx.beginPath();ctx.arc(p[0],p[1],w,0,7);ctx.fill();});}
  });
  // sparkles
  stars.forEach(i=>{
    const a=t*.2+i,p=P([Math.cos(a)*(.45+.3*Math.sin(i*3)),(i*.029+t*.03)%1.8,Math.sin(a)*(.4+.2*Math.cos(i*2))]);
    ctx.fillStyle='rgba(240,225,255,'+(.3+.6*Math.abs(Math.sin(t*2+i)))*cl(t/2)+')';
    ctx.fillRect(p[0],p[1],1.8,1.8);
  });
  // HUD
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 10px monospace';ctx.fillText('LILIUM ORIENTALIS',14,22);
  const lab=t<3?'STAGE 01 // STEM & FOLIAGE':t<7?'STAGE 02 // 3D TEPAL BLUEPRINT':'STAGE 03 // SUBSURFACE PIGMENTATION & PAPILLAE';
  ctx.font='9px monospace';ctx.fillText(lab,14,H-26);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(14,H-16,W-28,1);
  ctx.fillStyle='#fff';ctx.fillRect(14,H-17,(W-28)*cl(t/11),2);
}
let t0=performance.now();
function loop(n){frame((n-t0)/1000);requestAnimationFrame(loop);}
document.body.addEventListener('click',()=>{t0=performance.now();});
requestAnimationFrame(loop);
</script>
</body>
</html>
