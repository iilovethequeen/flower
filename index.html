<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Lily Bouquet</title>
<style>
:root{--bg:#000;--fg:#e6d8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#e6d8ff}}
:root[data-theme="dark"]{--bg:#000;--fg:#e6d8ff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif;cursor:pointer}
h1{font-weight:400;font-size:clamp(22px,6vw,40px);line-height:1.1;text-align:center;margin:0 16px 8px;font-style:italic}
.wrap{position:relative;width:min(96vw,560px)}
canvas{width:100%;height:auto;display:block}
.wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px)}
p{font-size:13px;opacity:.6;margin:6px 0 0}
</style>
</head>
<body>

<div class="wrap"><canvas id="c" width="600" height="660"></canvas></div>
<p>Tap to replay</p>
<script>
const CW=6,CH=11,COLS=100,ROWS=60;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const TR=72;cv.width=COLS*CW;cv.height=TR*CH;
const off=document.createElement('canvas');off.width=200;off.height=200;
const o=off.getContext('2d');
const small=document.createElement('canvas');small.width=COLS;small.height=ROWS;
const s=small.getContext('2d',{willReadFrequently:true});
const RAMP=' .:-=+*#%@';
const F=[
 {x:100,y:60,s:36,c:'#9b4dff',r:.3,d:.9},
 {x:58,y:92,s:32,c:'#c9a0ff',r:.1,d:1.2},
 {x:142,y:84,s:30,c:'#ffffff',r:.5,d:1.5},
 {x:42,y:130,s:26,c:'#7a2ff0',r:.2,d:1.8},
 {x:100,y:112,s:38,c:'#f2ecff',r:.4,d:2.1},
 {x:158,y:124,s:26,c:'#6a1fc4',r:.0,d:2.4},
 {x:72,y:36,s:22,c:'#b57cff',r:.6,d:2.7},
 {x:128,y:42,s:22,c:'#ffffff',r:.2,d:3.0}
];
const stars=Array.from({length:60},()=>[Math.random()*200,Math.random()*200,Math.random()]);
const cl=(v)=>Math.max(0,Math.min(1,v));
const ease=(v)=>1-Math.pow(1-v,3);
function stem(f,i,p){
  const bx=100+(i-4)*5,by=198,cx=bx+(f.x-bx)*.2+(i%2?-14:14),cy=(by+f.y)/2;
  o.strokeStyle='#e8e0ff';o.lineWidth=1.8;o.beginPath();
  const n=Math.floor(40*p);
  for(let k=0;k<=n;k++){const t=k/40,u=1-t;
    const x=u*u*bx+2*u*t*cx+t*t*f.x,y=u*u*by+2*u*t*cy+t*t*f.y;
    k?o.lineTo(x,y):o.moveTo(x,y);}
  o.stroke();
  if(p>.4){ // leaf
    const t=.45,u=1-t,x=u*u*bx+2*u*t*cx+t*t*f.x,y=u*u*by+2*u*t*cy+t*t*f.y;
    const L=26*cl((p-.4)*2.5),d=i%2?-1:1;
    o.fillStyle='#7a3fd1';o.beginPath();o.moveTo(x,y);
    o.quadraticCurveTo(x+d*L*.6,y-L*.5,x+d*L,y-L*.1);
    o.quadraticCurveTo(x+d*L*.5,y+L*.1,x,y);o.fill();
  }
}
function lily(f,b){
  const L=f.s*b,w=L*.28;
  for(let k=0;k<6;k++){
    o.save();o.translate(f.x,f.y);o.rotate(f.r+k*Math.PI/3+(1-b)*.8);
    const g=o.createLinearGradient(0,0,L,0);
    g.addColorStop(0,'#1a0a33');g.addColorStop(.35,f.c);g.addColorStop(1,f.c);
    o.fillStyle=g;o.beginPath();o.moveTo(0,0);
    o.quadraticCurveTo(L*.5,w*1.6,L,0);o.quadraticCurveTo(L*.5,-w*1.6,0,0);o.fill();
    o.strokeStyle='rgba(0,0,0,.45)';o.lineWidth=.8;
    o.beginPath();o.moveTo(0,0);o.lineTo(L*.9,0);o.stroke();
    o.restore();
  }
  o.strokeStyle='#ffffff';o.lineWidth=1;
  for(let k=0;k<5;k++){const a=f.r+k*1.26;
    o.beginPath();o.moveTo(f.x,f.y);o.lineTo(f.x+Math.cos(a)*L*.45,f.y+Math.sin(a)*L*.45);o.stroke();
    o.fillStyle='#d9b8ff';o.fillRect(f.x+Math.cos(a)*L*.45-1,f.y+Math.sin(a)*L*.45-1,2,2);}
}
function bud(f,p){
  const L=12*p;o.fillStyle=f.c;o.beginPath();o.ellipse(f.x,f.y,L*.35,L,f.r,0,7);o.fill();
}
const PAL=['#9b4dff','#ff5fd2','#6f8bff','#ffffff','#c9a0ff'];
function hx(c){return [1,3,5].map(i=>parseInt(c.substr(i,2),16));}
function pal(t,off){const n=PAL.length,u=t/3+off,i=Math.floor(u),f=u-i,e=f*f*(3-2*f);
  const a=hx(PAL[((i%n)+n)%n]),b=hx(PAL[(((i+1)%n)+n)%n]);
  return 'rgb('+a.map((v,k)=>Math.round(v+(b[k]-v)*e)).join(',')+')';}
function fishPos(t){const a=t*.55;
  return {x:100+82*Math.cos(a),y:100+70*Math.sin(a)+10*Math.sin(a*3),vx:-82*Math.sin(a),vy:70*Math.cos(a)};}
function fish(t){
  const al=ease(cl((t-.5)/2));if(al<=0)return;
  const p=fishPos(t),sx=Math.tanh(p.vx*.12),w=Math.sin(t*7);
  const tilt=Math.atan2(p.vy*.4,Math.abs(p.vx)+20)*(p.vx<0?-1:1);
  const c1=pal(t,0),c2=pal(t,.6),c3=pal(t,1.2);
  o.fillStyle='rgba(255,255,255,.85)';
  for(let k=1;k<9;k++){const q=fishPos(t-k*.13);o.fillRect(q.x+Math.sin(t*5+k)*6,q.y+Math.cos(t*4+k*2)*6,1.6,1.6);}
  o.save();o.translate(p.x,p.y);o.rotate(tilt);o.scale(sx*.85,.85);
  o.globalAlpha=al*.85;
  let g=o.createLinearGradient(-12,0,-56,0);g.addColorStop(0,c1);g.addColorStop(1,c2);
  o.fillStyle=g;o.beginPath();o.moveTo(-12,0);
  o.bezierCurveTo(-30,-28,-54,-24+w*6,-56,-2+w*8);
  o.bezierCurveTo(-54,24+w*6,-30,28,-12,0);o.fill();
  o.fillStyle=c3;o.globalAlpha=al*.7;
  o.beginPath();o.moveTo(-12,-7);o.quadraticCurveTo(-4,-28+w*2,12,-8);o.fill();
  o.beginPath();o.moveTo(-8,7);o.quadraticCurveTo(-16,26+w*3,8,8);o.fill();
  o.beginPath();o.ellipse(4,5,7,3,.6+w*.2,0,7);o.fill();
  o.globalAlpha=al;
  g=o.createLinearGradient(-14,0,18,0);g.addColorStop(0,c2);g.addColorStop(1,c1);
  o.fillStyle=g;o.beginPath();o.ellipse(0,0,18,9,0,0,7);o.fill();
  o.fillStyle='#fff';o.beginPath();o.arc(11,-2,2.2,0,7);o.fill();
  o.fillStyle='#000';o.beginPath();o.arc(11.6,-2,1,0,7);o.fill();
  o.restore();
}
function draw(t){
  o.clearRect(0,0,200,200);
  F.forEach((f,i)=>{
    const sp=ease(cl((t-i*.3)/3));
    if(sp>0)stem(f,i,sp);
  });
  F.forEach((f,i)=>{
    const sp=cl((t-i*.3)/3);
    if(sp<.99)return;
    const b=ease(cl((t-f.d-2.4)/2.6));
    b>0.12?lily(f,b):bud(f,cl((t-f.d-2)/1));
  });
  fish(t);
  s.clearRect(0,0,COLS,ROWS);s.imageSmoothingEnabled=true;
  s.drawImage(off,0,0,200,200,0,0,COLS,ROWS);
  const d=s.getImageData(0,0,COLS,ROWS).data;
  ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.font=(CW*1.7)+'px "Courier New",monospace';ctx.textBaseline='top';
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const i=(y*COLS+x)*4,a=d[i+3];
    if(a<30)continue;
    const r=d[i],g=d[i+1],bl=d[i+2];
    const lum=(.3*r+.59*g+.11*bl)/255*(a/255);
    const ch=RAMP[Math.min(9,Math.max(1,Math.round(lum*9)))];
    ctx.fillStyle=`rgb(${Math.min(255,r*1.2)|0},${Math.min(255,g*1.2)|0},${Math.min(255,bl*1.2)|0})`;
    ctx.fillText(ch,x*CW,y*CH);
  }
  ctx.fillStyle='#fff';
  stars.forEach(([x,y,r])=>{ctx.globalAlpha=.25+.5*Math.abs(Math.sin(t*1.2+r*9));ctx.fillRect(x*3,y*3.3,2,2);});
  ctx.globalAlpha=1;
  drawText(t);
}
const T0=7.5,parts=[];
(function(){
  const m=document.createElement('canvas');m.width=COLS;m.height=12;
  const q=m.getContext('2d',{willReadFrequently:true});
  const msg='love u nouf';let fs=14;
  q.font='italic bold '+fs+'px Georgia,serif';
  fs=Math.floor(fs*(COLS*.92)/q.measureText(msg).width);
  q.font='italic bold '+fs+'px Georgia,serif';
  q.textAlign='center';q.textBaseline='middle';q.fillStyle='#fff';
  q.fillText(msg,COLS/2,6.5);
  const d=q.getImageData(0,0,COLS,12).data,pool='lovenouf';
  for(let y=0;y<12;y++)for(let x=0;x<COLS;x++){
    if(d[(y*COLS+x)*4+3]<110)continue;
    const a=Math.random()*6.283,R=cv.width*(.6+Math.random()*.5);
    parts.push({tx:x*CW,ty:(ROWS+y)*CH,sx:cv.width/2+Math.cos(a)*R,sy:cv.height/2+Math.sin(a)*R,
      dl:Math.random()*1.6,ph:Math.random()*6.28,ch:pool[Math.floor(Math.random()*pool.length)]});
  }
})();
function drawText(t){
  ctx.font=(CW*1.7)+'px "Courier New",monospace';ctx.textBaseline='top';
  for(const p of parts){
    const k=cl((t-T0-p.dl)/2.6);if(k<=0)continue;
    const e=ease(k),w=(1-e)*28;
    const x=p.sx+(p.tx-p.sx)*e+Math.sin(t*4+p.ph)*w,y=p.sy+(p.ty-p.sy)*e+Math.cos(t*3+p.ph)*w;
    ctx.fillStyle=k<1?'#c9a0ff':'hsl(270,100%,'+(72+8*Math.sin(t*2+p.ph))+'%)';
    ctx.fillText(k<1?p.ch:'@',x,y);
  }
}
let start=performance.now();
function loop(now){draw((now-start)/1000);requestAnimationFrame(loop);}
document.body.addEventListener('click',()=>{start=performance.now();});
requestAnimationFrame(loop);
</script>
</body>
</html>
